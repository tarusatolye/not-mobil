name: CI

on:
  push:
    branches: [main, ci-deneme]
  pull_request:
  workflow_dispatch:

# Aynı dala yeni koşu gelince eskisi iptal edilir; mini PC'de aynı anda tek iş koşar (ortak kilit).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Herkese açık depo: fork'tan gelen PR mini PC'de kod çalıştıramaz (kullanıcı onayı 2026-11-14).
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: Analiz ve testler
    runs-on: [self-hosted, linux]   # mini PC (techstorm); GitHub'ın kendi sunucuları ödeme kilidinde
    timeout-minutes: 150   # mini PC sırasında bekleme de bu süreye sayılır
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true
      - name: Rust (super_native_extensions yerel derlemesi için; runner'da sudo yok, ~/.rustup'a kurar)
        uses: dtolnay/rust-toolchain@stable
      - name: Flutter (alt modülden)
        uses: adil192/setup-flutter-submodule@v3   # sığ alt modülde sürüm etiketini de getirir (0.0.0-unknown olmasın)
        with:
          flutter-path: submodules/flutter
      - run: flutter config --no-cli-animations --no-analytics
      - run: flutter pub get
      - name: Apple yazı tipleri (golden)
        run: dart run golden_screenshot:download_apple_fonts
      # Golden (piksel) testleri ayrı: Linux çizimi Windows'ta üretilmiş PNG'lerden farklı (İŞ-1456, Mankurt kararı:
      # golden yenileme ayrı iş). Golden doğrulaması içermeyen bütün test dosyaları koşar.
      - name: Testler (golden hariç)
        run: flutter test --no-pub $(grep -rL "matchesGoldenFile\|goldens/" test --include='*_test.dart' | sort)
      - name: Statik analiz (yalnız hatalar düşürür)
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
