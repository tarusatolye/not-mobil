name: Run tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

# Actions dakikası (2026-10-04): aynı PR'a yeni commit gelince eski çalışma
# iptal edilir; PR birleştirme commit'i PR'da sınandığı için main'de işler
# atlanır (doğrudan main push'u yine sınanır).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run-tests:
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Merge pull request') }}
    name: Run Flutter tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: "./.github/shared_workflows/install_apt_dependencies"

      - name: Setup cache
        uses: actions/cache@v6.1.0
        with:
          path: |
            .dart_tool/
            .flutter-plugins-dependencies
            build/
            linux/flutter/ephemeral/
            macos/Flutter/ephemeral/
            packages/**/.dart_tool/
            packages/**/.flutter-plugins-dependencies
            packages/**/pubspec.lock
            windows/flutter/ephemeral/
            ~/.dartServer/
            ~/.dart-tool/
          key: ${{ runner.OS }}-saber-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.OS }}-saber-

      - name: Setup Flutter
        uses: adil192/setup-flutter-submodule@v3
        with:
          flutter-path: submodules/flutter

      - name: Disable Flutter CLI animations
        run: flutter config --no-cli-animations

      - run: flutter pub get

      - name: Download Apple fonts
        run: dart run golden_screenshot:download_apple_fonts

      - name: Run tests
        id: tests
        run: flutter test --coverage --no-pub --file-reporter=json:test-results.json

      - name: Convert test results to JUnit XML for Codecov
        run: |
          flutter pub add dev:junitify
          dart run junitify -i test-results.json -o test-results.xml

      - name: Upload to Codecov
        if: success()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: test-results.xml

      - name: Ensure test failures directory exists
        if: failure()
        run: mkdir -p test/failures

      - name: Upload test failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Saber-test-failures
          path: test/failures

      - name: Run static analysis
        run: flutter analyze --no-pub

      - name: Check formatting
        run: dart format lib packages scripts test --output none --set-exit-if-changed
