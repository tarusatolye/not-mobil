  encLoginStep:
    enterEncPassword: "Verilerinizi korumak için lütfen şifreleme parolanızı girin:"
    newToSaber: tarus Not'ta ilk kez mi? Yeni bir şifreleme parolası girin.
    encPassword: Şifreleme parolası
    encFaqTitle: Sıkça sorulan sorular
    wrongEncPassword: Verilen parola ile şifre çözülemedi. Lütfen parolayı tekrar girin.
    connectionFailed: Sunucuya bağlanılamadı. Lütfen daha sonra tekrar deneyin.
    encFaq:
    - q: Şifreleme parolası nedir? Neden iki parola kullanıyorum?
      a: |-
        Hesap parolası (ya da eşitleme belirteci) sunucuya bağlanmak için kullanılıyor. Şifreleme parolası ise verilerinizi buluta aktarmadan önce gizlemek için kullanılıyor.
        Eğer birisi sunucudaki hesabınızı ele geçirseydi bile notlarınız güvenli ve şifreli kalmaya devam edecekti. Böylece ikinci bir güvenlik katmanı sağlamış oluyoruz.
        Buluttaki verilerinize, şifreleme parolası olmayan kimse erişemez; dolayısıyla bu parolayı kaybetmeniz durumunda siz de erişemezsiniz.
    - q: Henüz bir şifreleme parolası belirlemedim. Nereden alacağım?
      a: |-
        Yeni bir şifreleme parolası belirleyip yukarıya yazın.
        tarus Not şifreleme anahtarını bu paroladan üretir.
    - q: Hesap parolamla şifreleme parolam aynı olabilir mi?
      a: Evet fakat unutmayın ki bu durumda hesap parolanıza sahip herhangi birisi notlarınıza da erişebilir.
profile:
  title: Profilim
  logout: Çıkış yap
  quotaUsage: Toplam $total alanın $used kadarını ($percent%) kullandınız
  connectedTo: Bağlanılan sunucu
  quickLinks:
    serverHomepage: Sunucu anasayfası
    deleteAccount: Hesabı sil
  faqTitle: Sıkça sorulan sorular
  faq:
  - q: Çıkış yaparsam notlarımı kaybedecek miyim?
    a: Hayır. Notlarınız hem cihazınızda hem de sunucuda tutuluyor olacak. Siz tekrardan giriş yapana dek notlarınız senkronize edilmeyecek. Veri kaybı yaşamamak için çıkış yapmadan önce senkronizasyonun tamamlandığından emin olun (ana sayfada senkronizasyon ilerlemesini görebilirsiniz).
  - q: Hesap parolamı nasıl değiştirebilirim?
    a: Sunucu websitesine gidin ve hesabınıza giriş yapın. Arayüzde Ayarlar > Güvenlik > Parola değiştir yolunu takip edin. Parolanızı değiştirdikten sonra tarus Not'tan çıkış yapıp tekrardan giriş yapmanız gerekecek.
  - q: Şifreleme parolamı nasıl değiştirebilirim?
    a: |-
      1. tarus Not'tan çıkış yapın. Veri kaybı yaşamamak için çıkış yapmadan önce senkronizasyonun tamamlandığından emin olun (ana sayfada senkronizasyon ilerlemesini görebilirsiniz).
      2. Sunucu websitesine gidin ve 'Saber' klasörünü silin. Bu sunucudaki tüm notları silecek.
      3. tarus Not'a yeniden giriş yapın. Tekrar giriş yaparken yeni şifreleme parolanızı belirleyebilirsiniz.
      4. Diğer cihazlarınızda da tarus Not'tan çıkış yapıp tekrar giriş yapmayı unutmayın.
  - q: Hesabımı nasıl silebilirim?
    a: |-
      Üstte yer alan "@:profile.quickLinks.deleteAccount" butonuna tıklayın, gerekirse giriş yapın.
      tarus Not'un ayrı bir hesabı yoktur; kimliğiniz Pusula hesabınızdır. Bu cihazın eşitleme erişimini Pusula > Ayarlar > Not eşitleme bölümünden belirteci iptal ederek kaldırabilirsiniz. Sunucudaki notlarınızın ve hesap verilerinizin silinmesi için orada gösterilen silme talebi sayfasını kullanın.
      Eğer üçüncü parti bir sunucu kullanıyorsanız hesabınızı silme seçeneği sunulmuyor olabilir: daha fazla bilgi için ilgili sunucunun gizlilik politikasını inceleyin.
